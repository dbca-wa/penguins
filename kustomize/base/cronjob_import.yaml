apiVersion: batch/v1
kind: CronJob
metadata:
  name: penguins-import-cronjob
  labels:
    app: penguins-import-cronjob
spec:
  timeZone: 'Australia/Perth'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      parallelism: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: penguins-import-cronjob
              image: ghcr.io/dbca-wa/penguins
              command: ['python']
              args: ['--version']
              env:
                - name: TZ
                  value: 'Australia/Perth'
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
                runAsUser: 65532
                privileged: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - mountPath: /tmp
                  name: tmpfs-ram
          volumes:
            - name: tmpfs-ram
              emptyDir:
                medium: 'Memory'
          automountServiceAccountToken: false
          tolerations:
            - key: arch
              operator: Equal
              value: arm64
              effect: NoSchedule
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 1
                  preference:
                    matchExpressions:
                      - key: arch
                        operator: In
                        values:
                          - arm64
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: Exists
